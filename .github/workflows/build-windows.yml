name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required so GITHUB_TOKEN can create/update the GitHub Release; without this
# the release step fails with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build-windows:
    # Pinned to 2022: windows-latest moved to a newer MSVC that turns the
    # <experimental/coroutine> header used by flutter_inappwebview_windows into a
    # hard error (STL1011). VS 2022's compiler still accepts it.
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
      
      - name: Install dependencies
        run: |
          cd mod_manager_flutter
          flutter pub get
      
      - name: Build Windows Release
        # Belt-and-suspenders: define the macro MSVC suggests so the deprecated
        # <experimental/coroutine> header compiles even on a newer compiler. The
        # CL env var is read directly by cl.exe for every compilation.
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          cd mod_manager_flutter
          flutter build windows --release

      # Dropped into the build output before the ZIP is made, so the existing
      # copy step picks it up. Without it the portable build cannot install a
      # .rar or .7z mod — most of GameBanana — and there is no package manager
      # behind it to supply one.
      #
      # 7z.exe *and* 7z.dll: 7za.exe from "7-Zip Extra" is the reduced-format
      # build and cannot read RAR, which is the format this exists for.
      - name: Fetch bundled 7-Zip
        run: |
          # Pinned deliberately — 7-zip.org serves each build at its own /a/ URL
          # with no "latest" alias.
          $ver = "2602"
          $tools = "mod_manager_flutter\build\windows\x64\runner\Release\tools"
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z$ver-x64.exe" -OutFile "$env:TEMP\7zsetup.exe"
          & 7z x -y "-o$env:TEMP\7zwin" "$env:TEMP\7zsetup.exe" | Out-Null
          Copy-Item "$env:TEMP\7zwin\7z.exe" $tools
          Copy-Item "$env:TEMP\7zwin\7z.dll" $tools
          Copy-Item "$env:TEMP\7zwin\License.txt" "$tools\7-Zip-License.txt"
          # Fail the build rather than ship a ZIP that cannot open a .rar.
          if (-not (& "$tools\7z.exe" i | Select-String -Quiet 'Rar5')) { exit 1 }
        shell: pwsh

      - name: Create Portable ZIP
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrEmpty($version)) { $version = "dev" }
          .\windows_installer\build_portable.ps1 -Version $version
        shell: pwsh
      
      - name: Upload Portable Build
        uses: actions/upload-artifact@v4
        with:
          name: ZZZ-Mod-Manager-Windows-Portable
          path: windows_installer/output/*.zip
      
      - name: Upload Raw Build
        uses: actions/upload-artifact@v4
        with:
          name: ZZZ-Mod-Manager-Windows-Raw
          path: mod_manager_flutter/build/windows/x64/runner/Release/
      
      # Опціонально: створити GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows_installer/output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
