name: Build Linux Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required so GITHUB_TOKEN can create/update the GitHub Release; without this
# the release step fails with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd mod_manager_flutter
          flutter pub get

      - name: Build Linux Release
        run: |
          cd mod_manager_flutter
          flutter build linux --release

      # The portable build has no package manager behind it, so it ships its own
      # extractor — without one, .rar and .7z mods (most of GameBanana) cannot
      # be installed at all. The AUR package deliberately bundles nothing and
      # declares `7zip` instead, so pacman keeps it current.
      #
      # `7zzs` is the statically linked build: the target distro's libstdc++ is
      # unknown, and a dynamic binary is exactly what breaks on the older ones a
      # portable tarball exists to serve. `ArchiveService` looks for it beside
      # the executable before falling back to PATH.
      - name: Fetch bundled 7-Zip
        run: |
          # Pinned. 7-zip.org serves each build at its own /a/ URL and does not
          # keep a "latest" alias, so this is a version to bump deliberately
          # rather than a moving target.
          VER=2602
          curl -fsSL -o /tmp/7z.tar.xz \
            "https://www.7-zip.org/a/7z${VER}-linux-x64.tar.xz"
          mkdir -p /tmp/7z && tar -xf /tmp/7z.tar.xz -C /tmp/7z
          # Fail the build rather than ship a tarball that cannot open a .rar.
          test -x /tmp/7z/7zzs
          /tmp/7z/7zzs i | grep -q 'Rar5'

      - name: Create Portable Tarball
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev"; fi
          NAME="zzz-mod-manager-${VERSION}-linux-x86_64"
          mkdir -p "output/$NAME/tools"
          cp -r mod_manager_flutter/build/linux/x64/release/bundle/* "output/$NAME/"
          install -m755 /tmp/7z/7zzs "output/$NAME/tools/7zzs"
          # The desktop entry and its installer. A Wayland compositor takes the
          # window's icon from `<app id>.desktop`, never from the window itself,
          # so without these an extracted tarball can only ever show a
          # placeholder icon and an anonymous taskbar entry. The tarball cannot
          # ship a ready-to-use entry because `Exec` has to name wherever the
          # user extracted it, which is why this is a script and not a file.
          install -Dm644 \
            mod_manager_flutter/linux/packaging/io.github.notionme.ZzzModManager.desktop \
            "output/$NAME/packaging/io.github.notionme.ZzzModManager.desktop"
          install -Dm755 \
            mod_manager_flutter/linux/packaging/install-desktop-entry.sh \
            "output/$NAME/packaging/install-desktop-entry.sh"
          # LGPL, so the licence travels with the binary.
          install -m644 /tmp/7z/License.txt "output/$NAME/tools/7-Zip-License.txt"
          tar -C output -czf "output/${NAME}.tar.gz" "$NAME"
          ls -lh output

      - name: Upload Portable Build
        uses: actions/upload-artifact@v4
        with:
          name: ZZZ-Mod-Manager-Linux-Portable
          path: output/*.tar.gz

      # Optional: attach to the GitHub Release (same release the Windows job targets)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
